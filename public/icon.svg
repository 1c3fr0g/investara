<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6fffa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="140" fill="url(#invBg)"/>

  <!-- Subtle Inner Border Accent -->
  <rect x="12" y="12" width="488" height="488" rx="128" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Compass Star Emblem ✦ -->
  <path
    d="M 256 70
       Q 256 210, 396 256
       Q 256 302, 256 442
       Q 256 302, 116 256
       Q 256 210, 256 70 Z"
    fill="url(#starGrad)"
    filter="url(#shadow)"
  />

  <!-- Center Accent Gem -->
  <circle cx="256" cy="256" r="28" fill="#047857" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="16" fill="#34d399"/>
  <circle cx="252" cy="252" r="5" fill="#ffffff" opacity="0.8"/>
</svg>

